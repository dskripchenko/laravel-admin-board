name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Pin Testbench
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      # Laravel 11 is past its security-fix window; allow resolving it anyway.
      - name: Allow EOL framework resolution (Laravel 11 only)
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPUnit
        run: vendor/bin/phpunit

  reference:
    # The fixtures the PHP port is checked against come from the reference
    # implementation; regenerating them from the published package must give
    # the committed file byte for byte.
    name: Reference fixtures (@dskripchenko/board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the reference
        run: |
          mkdir -p "$RUNNER_TEMP/board"
          cd "$RUNNER_TEMP/board"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --omit=peer @dskripchenko/board@0.3.0

      - name: Regenerate and compare
        run: |
          node tests/Fixtures/reference/generate.mjs "$RUNNER_TEMP/board/node_modules/@dskripchenko/board/dist/index.mjs"
          git diff --exit-code -- tests/Fixtures/reference/reference.json
